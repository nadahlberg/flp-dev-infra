name: deploy

on:
  # Every change to main arrives through a merged PR (the ruleset forbids
  # direct pushes), and PR events have proven far more reliable than push
  # events for merge commits, which GitHub sometimes delivers very late.
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy

jobs:
  infra:
    # A merged PR labeled `skip-deploy` does not deploy (docs or `users`
    # changes); run the workflow by hand if one turns out to matter.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'skip-deploy')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: dev
          work-dir: infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
