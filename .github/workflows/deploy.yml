name: deploy

on:
  # Every change to main arrives through a merged PR (the ruleset forbids
  # direct pushes), and PR events have proven far more reliable than push
  # events for merge commits, which GitHub sometimes never records.
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cl_repo:
        description: CourtListener repo to build (owner/name)
        required: false
      cl_ref:
        description: CourtListener branch, tag or sha
        required: false
      mcp_repo:
        description: MCP (courtlistener-api-client) repo to build (owner/name)
        required: false
      mcp_ref:
        description: MCP branch, tag or sha
        required: false

concurrency:
  group: deploy

jobs:
  infra:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.cl_repo || vars.CL_REPO || 'freelawproject/courtlistener' }}
          ref: ${{ inputs.cl_ref || vars.CL_REF || 'main' }}
          path: cl-src
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.mcp_repo || vars.MCP_REPO || 'freelawproject/courtlistener-api-client' }}
          ref: ${{ inputs.mcp_ref || vars.MCP_REF || 'main' }}
          path: mcp-src
          token: ${{ secrets.GH_TOKEN }}

      - name: Resolve image tags
        run: |
          echo "CL_IMAGE_TAG=$(git -C cl-src rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "MCP_IMAGE_TAG=$(git -C mcp-src rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Deploying CourtListener $(git -C cl-src rev-parse HEAD) and MCP $(git -C mcp-src rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: dev
          work-dir: infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CL_CONTEXT: ../cl-src
          MCP_CONTEXT: ../mcp-src
          DEV_USER_NAME: ${{ vars.DEV_USER_NAME || 'dev' }}
          DEV_USER_EMAIL: ${{ secrets.DEV_USER_EMAIL }}
          DEV_USER_PASSWORD: ${{ secrets.DEV_USER_PASSWORD }}
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          CL_SENTRY_DSN: ${{ secrets.CL_SENTRY_DSN }}
          MCP_SENTRY_DSN: ${{ secrets.MCP_SENTRY_DSN }}
